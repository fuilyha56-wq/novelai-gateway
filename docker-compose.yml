services:
  novelai-gateway:
    build: .
    image: novelai-gateway:latest
    container_name: novelai-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-31555}:${PORT:-31555}"
    env_file:
      - .env
    volumes:
      # 配置文件（首次部署需从 .example 复制）
      - ./config:/app/config
      # 生成的图片持久化
      - ./images:/app/images
      # 日志持久化
      - ./logs:/app/logs
    stop_grace_period: 900s
    # 网关处理图片时会短暂占用较多内存；硬上限避免拖垮同机的 LFN。
    mem_limit: 512m
    cpus: "1.0"
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
