<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NAI Gateway</title>
<style>
:root{--wall:linear-gradient(120deg,#2b1055,#0f1a2e 50%,#03323f);--blur:18px;--alpha:.5;--dim:.2;--fg:#f1f3f8;--sub:#a3abc2;--acc:#8b7bff;--ok:#43d17a;--warn:#f0b43c;--err:#ff6370;--edge:rgba(255,255,255,.14)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;color:var(--fg);font:14px/1.55 system-ui,"Microsoft YaHei",sans-serif;background:#0b0f19 var(--wall) center/cover fixed no-repeat}
body::before{content:"";position:fixed;inset:0;background:rgba(0,0,0,var(--dim));z-index:-1}
.glass{background:rgba(18,22,36,var(--alpha));border:1px solid var(--edge);border-radius:16px;backdrop-filter:blur(var(--blur)) saturate(150%);-webkit-backdrop-filter:blur(var(--blur)) saturate(150%);box-shadow:0 10px 40px rgba(0,0,0,.3)}
aside{width:220px;margin:16px 0 16px 16px;padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:16px;height:calc(100vh - 32px)}
aside .logo{font-weight:800;font-size:18px;padding:0 10px 18px}aside .logo b{color:var(--acc)}
aside button{all:unset;cursor:pointer;padding:9px 12px;border-radius:10px;color:var(--sub)}
aside button:hover,aside button[aria-current=page]{background:rgba(255,255,255,.09);color:var(--fg)}
aside button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
main{flex:1;padding:16px 24px;min-width:0}
.page{display:none}.page.on{display:block;animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
h1{font-size:22px;margin:6px 0 18px}h3{margin:0 0 10px;font-size:13px;color:var(--sub);font-weight:600}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin-bottom:16px}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
.box{padding:18px}.big{font-size:32px;font-weight:800}.big small{font-size:13px;color:var(--sub);font-weight:400}
.meter{height:6px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--acc);transition:width .6s}.meter i.w{background:var(--warn)}.meter i.e{background:var(--err)}
table{width:100%;border-collapse:collapse}th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--edge)}
th{font-size:12px;color:var(--sub);font-weight:500}tr:last-child td{border-bottom:0}
.kv td:first-child{color:var(--sub);width:40%}
.btn{border:0;border-radius:10px;padding:8px 14px;font:inherit;color:#fff;background:var(--acc);cursor:pointer}
.btn.g{background:rgba(255,255,255,.1)}.btn.r{background:var(--err)}.btn:disabled{opacity:.5;cursor:wait}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.bar .fill{flex:1}
input,select,textarea{width:100%;font:inherit;color:var(--fg);background:rgba(0,0,0,.3);border:1px solid var(--edge);border-radius:10px;padding:8px 10px}
textarea{font:13px/1.5 Consolas,monospace}label{display:block;font-size:12px;color:var(--sub);margin:12px 0 4px}
.pill{display:inline-block;font-size:12px;padding:1px 9px;border-radius:20px;background:rgba(255,255,255,.1)}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.err{color:var(--err)}
.chip{border:1px solid var(--edge);background:rgba(255,255,255,.06);color:var(--fg);border-radius:20px;padding:5px 12px;cursor:pointer;font:inherit}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc)}
#logBox{height:68vh;overflow:auto;padding:14px;font:12.5px/1.65 Consolas,monospace;white-space:pre-wrap}
.L-INFO{color:var(--ok)}.L-WARNING{color:var(--warn)}.L-ERROR,.L-CRITICAL{color:var(--err);font-weight:700}.L-DEBUG{color:#6cb6ff}.t{color:var(--sub)}
pre{margin:0;white-space:pre-wrap;word-break:break-all;font:12px Consolas,monospace;max-height:420px;overflow:auto}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);z-index:9}
#gate form{width:340px;padding:26px}
#toast{position:fixed;right:20px;bottom:20px;padding:10px 16px;opacity:0;transition:.3s;pointer-events:none;z-index:10}#toast.on{opacity:1}#toast.bad{border-color:var(--err)}
#editBox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:8;padding:20px}
#editBox.on{display:flex}#editBox form{width:min(460px,100%);padding:24px}.edit-flags{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0}.edit-flags label{display:flex;align-items:center;gap:8px;margin:0;color:var(--fg)}.edit-flags input{width:auto}
.acc{padding:0;overflow:hidden}.acc .hd{display:flex;gap:12px;align-items:center;padding:16px 18px;background:linear-gradient(120deg,rgba(139,123,255,.28),rgba(67,209,122,.08))}
.acc .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--acc);flex:0 0 auto}
.acc .nm{flex:1;min-width:0}.acc .nm b{display:block;font-size:16px}.acc .nm small{color:var(--sub)}
.kpi{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--edge)}.kpi div{background:rgba(18,22,36,.35);padding:12px 18px}
.kpi span{display:block;font-size:12px;color:var(--sub)}.kpi b{font-size:18px}.acc details{padding:10px 18px 14px}.acc summary{cursor:pointer;color:var(--sub);font-size:13px}
.acc .all{max-height:380px;overflow:auto;margin-top:8px}.acc .all td{font-size:12.5px;padding:6px 8px;word-break:break-all}.acc .all td:first-child{color:var(--sub);font-family:Consolas,monospace;width:46%}
.sec td{color:var(--acc)!important;font-weight:700;font-family:inherit!important;padding-top:12px!important}
.tg{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.tg input{position:absolute;opacity:0;pointer-events:none}
.tg i{width:34px;height:19px;border-radius:10px;background:rgba(255,255,255,.16);position:relative;transition:.2s;flex:0 0 auto}
.tg i::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;transition:.2s}
.tg.on i{background:var(--ok)}.tg.on i::after{left:17px}
.tg:focus-within i{outline:2px solid var(--acc);outline-offset:2px}
.sw{display:flex;gap:10px;align-items:center;padding:10px 18px 0;font-size:12px;color:var(--sub)}
.tgrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tgrow>span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
@media(max-width:760px){body{flex-direction:column}aside{width:auto;height:auto;position:static;margin:12px;flex-direction:row;flex-wrap:wrap}aside .foot{margin:0;flex-direction:row}main{padding:12px}}
</style>
</head>
<body>
<div id="gate"><form class="glass" id="gateForm"><h1>NAI <b style="color:var(--acc)">Gateway</b></h1>
<label for="pw">管理密码</label><input id="pw" type="password" autocomplete="current-password" required>
<div class="bar" style="margin:16px 0 0"><span class="fill"></span><button class="btn">进入控制台</button></div></form></div>
<aside class="glass" aria-label="导航"><div class="logo">NAI <b>Gateway</b></div>
<button data-p="dash" aria-current="page">总览</button><button data-p="acct">账号池</button>
<button data-p="model">模型</button><button data-p="env">配置</button><button data-p="log">日志</button><button data-p="look">外观</button>
<div class="foot"><button id="restart">重启网关</button><button id="logout">退出登录</button></div></aside>
<main>
<section class="page on" id="dash"><h1>总览</h1><div class="grid" id="cnt"></div>
<div class="bar"><h2 class="fill" style="margin:8px 0 0;font-size:17px">NovelAI 账号</h2><span class="pill" id="upT">加载中...</span><button class="btn" id="upGo">刷新</button></div>
<div class="grid wide" id="upList"></div>
<div class="glass box"><h3>按模型统计</h3><table><thead><tr><th>模型</th><th>今日</th><th>近 7 天</th></tr></thead><tbody id="perm"></tbody></table></div></section>
<section class="page" id="acct"><div class="bar"><h1 class="fill">账号池</h1><button class="btn" id="addA">新增账号</button></div>
<div class="glass box"><table><thead><tr><th>名称</th><th>密钥</th><th>权重</th><th>状态</th><th>成功/失败</th><th>能力与操作</th></tr></thead><tbody id="accs"></tbody></table></div></section>
<section class="page" id="model"><div class="bar"><h1 class="fill">models.toml</h1><button class="btn g" id="mFetch">抓取上游模型</button><button class="btn" id="mSave">保存</button></div>
<textarea id="mTxt" rows="28" class="glass" aria-label="模型配置"></textarea></section>
<section class="page" id="env"><h1>环境配置</h1><form class="glass box" id="envF"></form></section>
<section class="page" id="log"><div class="bar"><h1 class="fill">日志</h1><label class="bar" style="margin:0"><input type="checkbox" id="lAuto" checked style="width:auto"> 实时</label>
<select id="lLv" style="width:130px" aria-label="级别"><option value="">全部级别</option><option>INFO</option><option>WARNING</option><option>ERROR</option></select></div>
<div class="glass" id="logBox" role="log" aria-live="polite"></div></section>
<section class="page" id="look"><h1>外观</h1><div class="glass box" style="max-width:560px">
<label for="wU">壁纸 URL（http/https）</label><div class="bar" style="margin:0"><input id="wU" class="fill" placeholder="https://..."><button class="btn" id="wSet">应用</button></div>
<label for="wF">本地图片</label><input id="wF" type="file" accept="image/*">
<label for="sB">模糊 <span id="vB"></span></label><input id="sB" type="range" min="0" max="40">
<label for="sA">面板不透明度 <span id="vA"></span></label><input id="sA" type="range" min="0" max="100">
<label for="sD">壁纸暗化 <span id="vD"></span></label><input id="sD" type="range" min="0" max="90">
<div class="bar" style="margin:16px 0 0"><span class="fill"></span><button class="btn g" id="wReset">恢复默认</button></div></div></section>
</main>
<div id="toast" class="glass" role="status"></div>
<div id="editBox"><form class="glass" id="editForm"><div class="bar"><h2 class="fill" style="margin:0">编辑账号</h2><button type="button" class="btn g" id="editClose">关闭</button></div>
<input type="hidden" id="editId"><label for="editName">账号名称</label><input id="editName" required>
<label for="editKey">NovelAI Token（留空保持不变）</label><input id="editKey" type="password" autocomplete="new-password" placeholder="pst-...">
<label for="editWeight">权重</label><input id="editWeight" type="number" min="1" max="100" required>
<div class="edit-flags"><label><input id="editEnabled" type="checkbox"> 启用账号</label><label><input id="editV5" type="checkbox"> 承接 V5</label><label><input id="editAnlas" type="checkbox"> 允许消耗 Anlas</label></div>
<div class="bar" style="margin:16px 0 0"><span class="fill"></span><button type="submit" class="btn">保存修改</button></div></form></div>
<script>
const $ = id => document.getElementById(id);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let tok = localStorage.getItem('gw_admin_token') || '', logT = null, logCur = 0, logFull = false, accountRows = [];

function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = 'glass on' + (bad ? ' bad' : ''); setTimeout(() => t.className = 'glass', 2800); }
async function api(p, o = {}) {
  o.headers = { ...(o.headers || {}), Authorization: 'Bearer ' + tok };
  if (typeof o.body === 'string') o.headers['Content-Type'] = 'application/json';
  const r = await fetch('/admin/api' + p, o);
  if (r.status === 401) { gate(true); throw new Error('未授权'); }
  if (!r.ok) throw new Error((await r.text()) || 'HTTP ' + r.status);
  return r.json();
}
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { toast(e.message, true); } };
function gate(show) { $('gate').style.display = show ? 'flex' : 'none'; if (show) $('pw').focus(); }
$('gateForm').onsubmit = run(async e => { e.preventDefault(); tok = $('pw').value; await api('/session'); localStorage.setItem('gw_admin_token', tok); gate(false); go('dash'); });
$('logout').onclick = () => { localStorage.removeItem('gw_admin_token'); location.reload(); };
$('restart').onclick = run(async () => { if (!confirm('确认重启网关？')) return; toast((await api('/restart', { method: 'POST' })).message); setTimeout(() => location.reload(), 3500); });

const loaders = { dash: () => Promise.all([loadDash(), loadUps()]), acct: loadAcct, model: loadModel, env: loadEnv, log: startLog, look: () => {} };
function go(p) {
  document.querySelectorAll('aside [data-p]').forEach(b => b.dataset.p === p ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  document.querySelectorAll('.page').forEach(s => s.classList.toggle('on', s.id === p));
  clearInterval(logT); run(loaders[p])();
}
document.querySelectorAll('aside [data-p]').forEach(b => b.onclick = () => go(b.dataset.p));

function stat(t, v, lim) {
  const p = lim ? Math.min(v / lim * 100, 100) : 0, c = p >= 90 ? 'e' : p >= 70 ? 'w' : '';
  return `<div class="glass box"><h3>${esc(t)}</h3><div class="big">${v}${lim ? ` <small>/ ${lim}</small>` : ''}</div>` +
    (lim ? `<div class="meter" role="progressbar" aria-label="${esc(t)}" aria-valuenow="${p.toFixed(0)}" aria-valuemin="0" aria-valuemax="100"><i class="${c}" style="width:${p}%"></i></div>` : '') + '</div>';
}
async function loadDash() {
  const u = (await api('/overview')).usage || {}, c = u.counters || {};
  $('cnt').innerHTML = stat('今日 · 全部模型', c.daily_all ?? 0) + stat('今日 · V4.5', c.daily_v45 ?? 0) +
    stat('今日 · V5', c.daily_v5 ?? 0, u.daily_limit) + stat('近 7 天 · V5', c.weekly_v5 ?? 0, u.weekly_limit) + stat('本月 · V5', c.monthly_v5 ?? 0);
  const rows = Object.entries(u.per_model || {}).sort((a, b) => b[1].used_today - a[1].used_today);
  $('perm').innerHTML = rows.map(([m, v]) => `<tr><td>${esc(m)}</td><td>${v.used_today}</td><td>${v.used_this_week}</td></tr>`).join('') || '<tr><td colspan="3">暂无数据</td></tr>';
}

const pill = s => `<span class="pill ${/^(active|ok|healthy)$/.test(s) ? 'ok' : s === 'disabled' ? '' : 'warn'}">${esc(s)}</span>`;
const tgl = (a, k, id, on) => `<label class="tg${on ? ' on' : ''}" title="${esc(a)}"><input type="checkbox" data-k="${k}" data-id="${esc(id)}" ${on ? 'checked' : ''}><i></i></label>`;
async function loadAcct() {
  const l = (await api('/accounts')).accounts || [];
  accountRows = l;
  $('accs').innerHTML = l.map(a => `<tr><td>${esc(a.name)}</td><td><code>${esc(a.masked_key)}</code></td><td>${esc(a.weight)}</td><td>${pill(a.status)}</td>` +
    `<td>${a.success_count}/${a.failure_count}</td><td class="tgrow"><span title="账号是否参与请求">启用${tgl('停用后保留账号配置，不再参与请求', 'enabled', a.id, a.enabled !== false)}</span><span title="承接 V5 模型请求">V5${tgl('是否允许该账号使用 V5 模型', 'v5', a.id, a.allow_v5 !== false)}</span>` +
    `<span title="是否允许消耗 Anlas">Anlas${tgl('是否允许该账号消耗 Anlas', 'anlas', a.id, a.allow_anlas !== false)}</span>` +
    `<div class="bar" style="margin:0">` +
    ['view:查看上游:g', 'edit:编辑:g', 'test:测试:g', 'reset:重置:g', 'del:删除:r'].map(x => { const [k, n, c] = x.split(':'); return `<button class="btn ${c}" data-k="${k}" data-id="${esc(a.id)}">${n}</button>`; }).join('') +
    '</div></td></tr>').join('') || '<tr><td colspan="6">暂无账号</td></tr>';
}
$('accs').onclick = run(async e => {
  const t = e.target.closest('.tg input');
  if (t) {
    const ep = t.dataset.k === 'v5' ? 'allow-v5' : t.dataset.k === 'anlas' ? 'allow-anlas' : 'enabled';
    const field = ep === 'enabled' ? 'enabled' : ep.replace('-', '_');
    const r = await api(`/accounts/${encodeURIComponent(t.dataset.id)}/${ep}`, { method: 'PUT', body: JSON.stringify({ [field]: t.checked }) });
    toast(r.message); return loadAcct();
  }
  const b = e.target.closest('button'); if (!b) return;
  const id = encodeURIComponent(b.dataset.id);
  if (b.dataset.k === 'view') { go('dash'); return setTimeout(() => document.getElementById('up_' + b.dataset.id)?.scrollIntoView({ behavior: 'smooth' }), 1200); }
  if (b.dataset.k === 'edit') { openEdit(accountRows.find(a => a.id === b.dataset.id)); return; }
  if (b.dataset.k === 'test') { const r = await api(`/accounts/${id}/test`, { method: 'POST' }); toast(r.message, !r.ok); }
  if (b.dataset.k === 'reset') toast((await api(`/accounts/${id}/reset`, { method: 'POST' })).message);
  if (b.dataset.k === 'del') { if (!confirm('确认删除该账号？')) return; toast((await api(`/accounts/${id}`, { method: 'DELETE' })).message); }
  loadAcct();
});
function openEdit(a) {
  if (!a) return toast('账号不存在，请刷新列表', true);
  $('editId').value = a.id; $('editName').value = a.name || ''; $('editKey').value = '';
  $('editWeight').value = a.weight || 1; $('editEnabled').checked = a.enabled !== false;
  $('editV5').checked = a.allow_v5 !== false; $('editAnlas').checked = a.allow_anlas !== false;
  $('editBox').classList.add('on'); $('editName').focus();
}
function closeEdit() { $('editBox').classList.remove('on'); }
$('editClose').onclick = closeEdit;
$('editBox').onclick = e => { if (e.target === $('editBox')) closeEdit(); };
$('editForm').onsubmit = run(async e => {
  e.preventDefault();
  const id = encodeURIComponent($('editId').value), body = {
    name: $('editName').value.trim(), weight: Number($('editWeight').value),
    enabled: $('editEnabled').checked, allow_v5: $('editV5').checked, allow_anlas: $('editAnlas').checked,
  };
  const key = $('editKey').value.trim(); if (key) body.key = key;
  await api(`/accounts/${id}`, { method: 'PUT', body: JSON.stringify(body) });
  closeEdit(); toast('账号已更新'); loadAcct();
});
$('addA').onclick = run(async () => {
  const name = prompt('账号名称'); if (!name) return;
  const key = prompt('NovelAI 持久化 Token'); if (!key) return;
  await api('/accounts', { method: 'POST', body: JSON.stringify({ name, key }) }); toast('已添加'); loadAcct();
});
const ts = t => { if (!t) return '--'; const d = new Date(t > 1e12 ? t : t * 1000); return isNaN(d) ? '--' : d.toLocaleString('zh-CN'); };
const yes = (ok, a, b) => `<span class="pill ${ok ? 'ok' : 'err'}">${ok ? a : b}</span>`;
const kv = r => r.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('');
const TIER = { 0: 'Free', 1: 'Tablet', 2: 'Scroll', 3: 'Opus' };
const isTsKey = k => /(At|Time|Date|expires)$/i.test(k);
function flat(o, p = '', out = []) {
  for (const [k, v] of Object.entries(o ?? {})) {
    const key = p ? `${p}.${k}` : k;
    if (v && typeof v === 'object' && !Array.isArray(v) && Object.keys(v).length) flat(v, key, out);
    else out.push([key, v]);
  }
  return out;
}
const show = (k, v) => v === null || v === undefined || v === '' ? '<span class="t">--</span>'
  : typeof v === 'boolean' ? yes(v, '是', '否')
  : typeof v === 'number' && isTsKey(k) && v > 1e9 ? `${esc(ts(v))} <small class="t">${v}</small>`
  : Array.isArray(v) ? `<code>${esc(JSON.stringify(v))}</code>` : esc(v);
const allRows = (title, obj) => `<tr class="sec"><td colspan="2">${esc(title)}</td></tr>` + flat(obj).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${show(k, v)}</td></tr>`).join('');

function accCard(a, r, err, duplicate = false) {
  const duplicateTip = duplicate ? '<span class="pill warn" title="多个账号使用同一个 Token，上游返回的数据会相同">重复凭据</span>' : '';
  const head = `<div class="hd"><div class="av" aria-hidden="true">${esc((a.name || '?')[0].toUpperCase())}</div><div class="nm"><b>${esc(a.name)}</b><small><code>${esc(a.masked_key)}</code></small></div>${duplicateTip}${pill(a.status)}</div>`;
  const sw = `<div class="sw">${tgl('停用后保留账号配置，不再参与请求', 'enabled', a.id, a.enabled !== false)}<span>启用</span>${tgl('是否允许该账号使用 V5 模型', 'v5', a.id, a.allow_v5 !== false)}<span>V5</span>${tgl('是否允许该账号消耗 Anlas', 'anlas', a.id, a.allow_anlas !== false)}<span>Anlas</span></div>`;
  if (err) return `<article class="glass acc" id="up_${esc(a.id)}">${head}${sw}<div class="box"><span class="pill err">拉取失败</span> <small>${esc(err)}</small></div></article>`;
  const s = r.subscription || {}, d = r.user_data || {}, pk = s.perks || {}, pr = d.priority || {}, inf = d.information || {}, st = s.trainingStepsLeft || {};
  const tier = s.tier ?? 0, u = s.usage || {}, pct = Number(u.percent), has = Number.isFinite(pct), rem = has ? Math.max(0, pct) : 0, sec = Number(u.timeUntilNextPercent);
  const anlas = (st.fixedTrainingStepsLeft ?? 0) + (st.purchasedTrainingSteps ?? 0);
  const k = (n, v) => `<div><span>${n}</span><b>${v}</b></div>`;
  return `<article class="glass acc" id="up_${esc(a.id)}">${head}${sw}
<div class="kpi">${k('订阅', `${esc(TIER[tier] || 'Tier ' + tier)} ${yes(s.active !== false, '有效', '失效')}`)}${k('Anlas', anlas.toLocaleString())}
${k('V5 剩余', has ? `${u.isNegative ? '-' : ''}${rem}% <small class="t">≈${Math.round(rem * 17.3)} 张</small>` : '--')}
${k('V5 补充', !has ? '--' : sec > 0 ? `${Math.ceil(sec / 60)} 分钟/1%` : '暂停')}
${k('到期', esc(ts(s.expiresAt)))}${k('封禁', yes(!inf.banStatus || inf.banStatus === 'not_banned', '正常', esc(inf.banStatus)))}
${k('任务优先级', esc(pr.taskPriority ?? pk.startPriority ?? '--'))}${k('下次刷新', esc(ts(pr.nextRefillAt)))}</div>
${has ? `<div style="padding:0 18px"><div class="meter"><i class="${rem < 10 ? 'e' : rem < 30 ? 'w' : ''}" style="width:${Math.min(rem, 100)}%"></i></div></div>` : ''}
<details><summary>全部上游字段（${flat(s).length + flat(d).length} 项）</summary><div class="all"><table><tbody>${allRows('subscription', s)}${allRows('user_data', d)}</tbody></table></div></details></article>`;
}

async function loadUps() {
  const btn = $('upGo'); btn.disabled = true; $('upT').textContent = '同步中...';
  try {
    const list = (await api('/accounts')).accounts || [];
    const seenKeys = new Map();
    list.forEach(a => seenKeys.set(a.masked_key, (seenKeys.get(a.masked_key) || 0) + 1));
    if (!list.length) { $('upList').innerHTML = '<div class="glass box">尚未配置账号</div>'; $('upT').textContent = '无账号'; return; }
    $('upList').innerHTML = list.map(a => `<article class="glass acc" id="up_${esc(a.id)}"><div class="box">正在拉取 ${esc(a.name)}...</div></article>`).join('');
    await Promise.all(list.map(async a => {
      let html;
      try {
        const duplicate = seenKeys.get(a.masked_key) > 1;
        const upstream = await api('/upstream/account-data?account_id=' + encodeURIComponent(a.id));
        html = accCard(a, upstream, null, duplicate);
      }
      catch (e) { html = accCard(a, null, e.message); }
      const el = document.getElementById('up_' + a.id); if (el) el.outerHTML = html;
    }));
    $('upT').textContent = '上游数据同步于 ' + new Date().toLocaleTimeString('zh-CN');
  } finally { btn.disabled = false; }
}
$('upGo').onclick = () => run(loadUps)();
$('upList').onclick = run(async e => {
  const t = e.target.closest('.tg input'); if (!t) return;
  const ep = t.dataset.k === 'v5' ? 'allow-v5' : t.dataset.k === 'anlas' ? 'allow-anlas' : 'enabled';
  const field = ep === 'enabled' ? 'enabled' : ep.replace('-', '_');
  const r = await api(`/accounts/${encodeURIComponent(t.dataset.id)}/${ep}`, { method: 'PUT', body: JSON.stringify({ [field]: t.checked }) });
  toast(r.message);
});


async function loadModel() { $('mTxt').value = (await api('/models/config')).content; }
$('mSave').onclick = run(async () => toast((await api('/models/config', { method: 'PUT', body: JSON.stringify({ content: $('mTxt').value }) })).message));
$('mFetch').onclick = run(async () => { await api('/models/refresh', { method: 'POST' }); toast('已抓取上游模型'); loadModel(); });

const KEYS = ['IMAGE_BASE_URL', 'HOST', 'PORT', 'MAX_CONCURRENT', 'QUEUE_MAX_WAITERS', 'COOLDOWN_MIN', 'COOLDOWN_MAX', 'V5_QUOTA_ENABLED', 'V5_DAILY_LIMIT', 'V5_WEEKLY_LIMIT'];
async function loadEnv() {
  const e = (await api('/env')).env || {};
  $('envF').innerHTML = KEYS.map(k => `<label for="e_${k}">${k}</label><input id="e_${k}" name="${k}" value="${esc(e[k])}">`).join('') +
    '<div class="bar" style="margin:16px 0 0"><span class="fill"></span><button class="btn">保存（重启后生效）</button></div>';
}
$('envF').onsubmit = run(async e => { e.preventDefault(); toast((await api('/env', { method: 'PUT', body: JSON.stringify(Object.fromEntries(new FormData(e.target))) })).message); });

const LR = /^(\S+(?: \S+)?) \| (\w+)\s* \| (.*)$/;
async function fetchLog() {
  const r = await api('/logs/recent?cursor=' + (logFull ? logCur : -1));
  if (r.last < logCur) logFull = false;
  logCur = r.last; logFull = true;
  return r.lines || [];
}
async function loadLog() {
  const lines = await fetchLog(), f = $('lLv')?.value || '', box = $('logBox');
  const bottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 30;
  const seg = lines.map(l => {
    const m = l.match(LR);
    if (!m) return f ? '' : esc(l);
    return f && m[2] !== f ? '' : `<span class="t">${esc(m[1])}</span> <span class="L-${esc(m[2])}">${esc(m[2].padEnd(7))}</span> ${esc(m[3])}`;
  }).filter(Boolean).join('\n');
  if (seg) box.insertAdjacentHTML('beforeend', (box.textContent ? '\n' : '') + seg);
  // 只保留最近的日志节点，避免长驻页面内存膨胀
  while (box.childNodes.length > 4000) box.removeChild(box.firstChild);
  if (bottom) box.scrollTop = box.scrollHeight;
}
async function startLog() { $('logBox').textContent = ''; logCur = 0; logFull = false; await loadLog(); logT = setInterval(() => $('lAuto')?.checked && run(loadLog)(), 2000); }
$('lLv').onchange = () => { $('logBox').textContent = ''; logCur = 0; logFull = false; run(loadLog)(); };

const DEF = { wall: '', blur: 18, alpha: 50, dim: 20 };
let th = { ...DEF, ...JSON.parse(localStorage.getItem('gw_theme2') || '{}') };
function paint() {
  const r = document.documentElement.style;
  if (th.wall) r.setProperty('--wall', `url("${th.wall.replace(/["\\]/g, encodeURIComponent)}")`); else r.removeProperty('--wall');
  r.setProperty('--blur', th.blur + 'px'); r.setProperty('--alpha', th.alpha / 100); r.setProperty('--dim', th.dim / 100);
  $('sB').value = th.blur; $('sA').value = th.alpha; $('sD').value = th.dim;
  $('vB').textContent = th.blur + 'px'; $('vA').textContent = th.alpha + '%'; $('vD').textContent = th.dim + '%';
  if (!th.wall.startsWith('data:')) $('wU').value = th.wall;
}
function keep() { try { localStorage.setItem('gw_theme2', JSON.stringify(th)); } catch { toast('图片过大，仅本次生效', true); } paint(); }
[['sB', 'blur'], ['sA', 'alpha'], ['sD', 'dim']].forEach(([id, k]) => $(id).oninput = e => { th[k] = +e.target.value; keep(); });
$('wSet').onclick = () => { const v = $('wU').value.trim(); if (v && !/^https?:\/\//i.test(v)) return toast('仅支持 http/https 地址', true); th.wall = v; keep(); };
$('wF').onchange = e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { th.wall = rd.result; keep(); }; rd.readAsDataURL(f); };
$('wReset').onclick = () => { th = { ...DEF }; keep(); };
paint();

if (tok) api('/session').then(() => { gate(false); go('dash'); }).catch(() => gate(true)); else gate(true);
setInterval(() => $('dash').classList.contains('on') && $('gate').style.display === 'none' && run(loadDash)(), 15000);
setInterval(() => $('dash').classList.contains('on') && $('gate').style.display === 'none' && run(loadUps)(), 60000);
</script>
</body>
</html>
